services:
  - type: web
    name: docket
    runtime: docker
    plan: starter
    healthCheckPath: /login.html
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: docket-db
          property: connectionString
      - key: ATTORNEY_USERNAME
        sync: false
      - key: ATTORNEY_PASSWORD
        sync: false
      - key: TRUST_PROXY
        value: "true"

databases:
  - name: docket-db
    plan: free
