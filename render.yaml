services:
  - type: web
    name: docket
    runtime: docker
    plan: starter
    healthCheckPath: /login.html
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: docket-db
          property: connectionString
      - key: ATTORNEY_USERNAME
        sync: false
      - key: ATTORNEY_PASSWORD
        sync: false
      - key: TRUST_PROXY
        value: "true"
      # Optional — set to "true" to populate sample matters/a deadline/an
      # appointment/a draft on first boot, so first login isn't a blank
      # page. See CLAUDE.md's "Commands" section / DEPLOY.md. Leave unset
      # for a real firm's first deploy.
      - key: DEMO_SEED
        value: "true"

databases:
  - name: docket-db
    plan: free
