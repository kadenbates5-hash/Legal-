<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Docket — Set a new password</title>
<link rel="stylesheet" href="/login.css" />
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="card">
  <div class="brand"><span class="mark"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.4 14.8 7.8 10 17 5.2 7.8Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="6.6" r="0.85" fill="currentColor"/><path d="M10 8.6v6.7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span><span class="name">Docket</span></div>
  <p class="tagline" id="tagline">Choose a new password. This link can only be used once.</p>

  <form id="resetForm">
    <label>New password <input id="newPassword" type="password" autocomplete="new-password" required minlength="8" /></label>
    <label>Confirm new password <input id="confirmPassword" type="password" autocomplete="new-password" required minlength="8" /></label>
    <button type="submit" class="submit">Set new password</button>
    <div id="error" class="error"></div>
  </form>
  <p class="footer-link"><a href="/login.html">Back to sign in</a></p>
</div>

<script src="/reset-password.js"></script>
</body>
</html>
