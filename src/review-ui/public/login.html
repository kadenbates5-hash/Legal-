<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Docket — Sign in</title>
<link rel="stylesheet" href="/login.css" />
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="card">
  <div class="brand"><span class="mark">D</span><span class="name">Docket</span></div>
  <p class="tagline">AI receptionist &amp; paralegal, always chaperoned by a human attorney. Sign in to continue.</p>

  <form id="loginForm">
    <label>Username <input id="username" type="text" autocomplete="username" required /></label>
    <label>Password <input id="password" type="password" autocomplete="current-password" required /></label>
    <div class="remember">
      <input id="remember" type="checkbox" />
      <label for="remember">Remember me on this device</label>
    </div>
    <label id="mfaField" hidden>Authentication code
      <input id="mfaCode" type="text" inputmode="numeric" autocomplete="one-time-code"
             placeholder="000000 — or a recovery code" />
    </label>
    <button type="submit" class="submit">Sign in</button>
    <div id="error" class="error"></div>
  </form>
</div>

<script src="/login.js"></script>
</body>
</html>
