<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Docket — Sign in</title>
<link rel="stylesheet" href="/login.css" />
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="card">
  <div class="brand"><span class="mark"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.4 14.8 7.8 10 17 5.2 7.8Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="6.6" r="0.85" fill="currentColor"/><path d="M10 8.6v6.7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span><span class="name">Docket</span></div>
  <p class="tagline">AI receptionist &amp; paralegal, always chaperoned by a human attorney. Sign in to continue.</p>

  <form id="loginForm">
    <label>Username <input id="username" type="text" autocomplete="username" required /></label>
    <label>Password <input id="password" type="password" autocomplete="current-password" required /></label>
    <div class="remember">
      <input id="remember" type="checkbox" />
      <label for="remember">Remember me on this device</label>
    </div>
    <label id="mfaField" hidden>Authentication code
      <input id="mfaCode" type="text" inputmode="numeric" autocomplete="one-time-code"
             placeholder="000000 — or a recovery code" />
    </label>
    <button type="button" class="link-btn" id="passkeyLoginBtn" hidden>Use a passkey instead</button>
    <button type="submit" class="submit">Sign in</button>
    <div id="error" class="error"></div>
  </form>
  <p class="footer-link"><a href="/forgot-password.html">Forgot your password?</a></p>
  <p class="footer-credit">Crafted by <strong>KJB Forge</strong></p>
</div>

<script src="/login.js"></script>
</body>
</html>
