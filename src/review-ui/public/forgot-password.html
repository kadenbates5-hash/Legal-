<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Docket — Reset your password</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
<meta name="theme-color" content="#efe8da" />
<link rel="stylesheet" href="/login.css" />
</head>
<body>
<div class="scene" data-parallax aria-hidden="true">
  <div class="horizon"></div>
  <div class="desk"><div class="pad"></div></div>
</div>
<div class="card">
  <div class="brand"><span class="mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path class="m-tab" d="M4 13V8.2A3.2 3.2 0 0 1 7.2 5h5.6c.9 0 1.7.4 2.3 1.1L17.4 9V13H4z"/><path class="m-body" d="M4 9h20.8A3.2 3.2 0 0 1 28 12.2v12.6a3.2 3.2 0 0 1-3.2 3.2H7.2A3.2 3.2 0 0 1 4 24.8z"/><path class="m-glyph" fill-rule="evenodd" d="M10.5 13.2h5a5.3 5.3 0 0 1 0 10.6h-5zm3.1 2.8h1.8a2.5 2.5 0 0 1 0 5h-1.8z"/></svg></span><span class="name">Docket</span></div>
  <p class="tagline">Enter your username and, if there's an email on file for your account, we'll send a link to set a new password.</p>

  <form id="forgotForm">
    <label>Username <input id="username" type="text" autocomplete="username" required /></label>
    <button type="submit" class="submit">Send reset link</button>
    <div id="error" class="error" role="alert"></div>
  </form>
  <p class="footer-link"><a href="/login.html">Back to sign in</a></p>
</div>

<script src="/theme.js"></script>
<script src="/depth.js"></script>
<script src="/forgot-password.js"></script>
</body>
</html>
