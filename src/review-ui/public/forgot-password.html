<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Docket — Reset your password</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
<meta name="theme-color" content="#2c4270" />
<link rel="stylesheet" href="/login.css" />
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="card">
  <div class="brand"><span class="mark"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.4 14.8 7.8 10 17 5.2 7.8Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="6.6" r="0.85" fill="currentColor"/><path d="M10 8.6v6.7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span><span class="name">Docket</span></div>
  <p class="tagline">Enter your username and, if there's an email on file for your account, we'll send a link to set a new password.</p>

  <form id="forgotForm">
    <label>Username <input id="username" type="text" autocomplete="username" required /></label>
    <button type="submit" class="submit">Send reset link</button>
    <div id="error" class="error"></div>
  </form>
  <p class="footer-link"><a href="/login.html">Back to sign in</a></p>
</div>

<script src="/forgot-password.js"></script>
</body>
</html>
