<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Docket — Review and sign</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
<meta name="theme-color" content="#2c4270" />
<link rel="stylesheet" href="/login.css" />
<link rel="stylesheet" href="/sign.css" />
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="card sign-card">
  <div class="brand"><span class="mark"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.4 14.8 7.8 10 17 5.2 7.8Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="6.6" r="0.85" fill="currentColor"/><path d="M10 8.6v6.7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span><span class="name">Docket</span></div>
  <p class="tagline" id="tagline">Loading your document…</p>
  <div id="loadError" class="error"></div>

  <div id="signArea" hidden>
    <h2 class="doc-title" id="docTitle"></h2>
    <iframe id="pdfFrame" class="pdf-frame" title="Document to review and sign"></iframe>

    <form id="signForm">
      <label>Type your full name to sign <input id="signatureText" type="text" autocomplete="name" required /></label>
      <label class="consent"><input id="consentCheck" type="checkbox" required /> I agree that typing my name and clicking "Sign document" constitutes my legal signature on this document.</label>
      <button type="submit" class="submit">Sign document</button>
      <div id="formError" class="error"></div>
    </form>
    <button type="button" id="declineBtn" class="link-btn">Decline to sign</button>
  </div>

  <div id="doneArea" hidden>
    <p class="tagline done-message" id="doneMessage"></p>
  </div>
</div>

<script src="/sign.js"></script>
</body>
</html>
