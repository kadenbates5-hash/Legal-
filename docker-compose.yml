# For self-hosting on a VPS/server you control: `docker compose up -d`.
# Put a real reverse proxy (Caddy/nginx/Traefik) with TLS in front of
# port 3000 for anything beyond local testing — this compose file does
# not terminate TLS itself. Copy `.env.example` to `.env` and fill it in
# before starting, or set the same vars another way.
services:
  docket:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://docket:${POSTGRES_PASSWORD}@db:5432/docket
      ATTORNEY_USERNAME: ${ATTORNEY_USERNAME}
      ATTORNEY_PASSWORD: ${ATTORNEY_PASSWORD}
      TRUST_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: docket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: docket
    volumes:
      - docket-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docket"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  docket-db:
